<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AcxiomCRM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--navy:#17243a;--blue:#4361ee;--bg:#f5f7fb;--muted:#78849a;--line:#e8edf5}
body{background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1e293b}
.sidebar{width:230px;background:var(--navy);min-height:100vh;color:#fff;position:fixed;inset:0 auto 0 0;padding:24px 15px;z-index:5}
.brand{font-weight:800;font-size:21px;margin:0 10px 30px}.brand span{color:#91a2ff}
.nav-link{color:#bdc7d9;padding:11px 13px;border-radius:9px;margin:3px 0;cursor:pointer;font-size:14px}
.nav-link:hover,.nav-link.active{background:#2a3a55;color:white}
.main{margin-left:230px;padding:27px 30px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
h1{font-size:26px;font-weight:750;margin:5px 0}.muted{color:var(--muted);font-size:13px}.eyebrow{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
.card{border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #17243a05}.metric{padding:20px}.metric-label{color:var(--muted);font-size:13px}.metric-value{font-size:27px;font-weight:750;margin:9px 0}
.section{padding:20px}.section-title{font-size:16px;font-weight:700}
.table{font-size:13px;vertical-align:middle}.table th{color:var(--muted);font-weight:600;white-space:nowrap}.table td{padding-top:13px;padding-bottom:13px}
.form-control,.form-select{font-size:14px;padding:10px 12px;border-color:#dfe5ef}.btn{font-size:13px;border-radius:8px;font-weight:600;padding:9px 13px}.btn-primary{background:var(--blue);border-color:var(--blue)}
.pill{display:inline-block;background:#edf0ff;color:#4056cc;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600}
.auth-wrap{max-width:440px;margin:8vh auto}.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:760px){.sidebar{width:65px;padding:18px 6px}.brand{font-size:0;margin:0 7px 25px}.brand span{font-size:16px}.nav-link{font-size:0;text-align:center;padding:12px 2px}.nav-link .sym{font-size:18px}.main{margin-left:65px;padding:18px 12px}.topline{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-dark border-0"><div class="d-flex"><div id="toastText" class="toast-body"></div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
<div class="modal fade" id="recordModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0" style="border-radius:15px"><div class="modal-header border-0 px-4 pt-4"><h5 class="modal-title fw-bold" id="modalTitle">Add record</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><form id="recordForm"><div class="modal-body px-4" id="fields"></div><div class="modal-footer border-0 px-4 pb-4"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save record</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body></html>
